<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470"
     role="img" aria-labelledby="flow-title flow-desc">
  <title id="flow-title">怎么跑的：预热目录 → SQLDelight 索引库 → 并行检索 → 构建结果树</title>
  <desc id="flow-desc">四个阶段：IndexWarmer 按 lastModified 增量预热；索引库用 root / entry / content 三张表缓存目录树与解码后的正文；SearchEngine 并行遍历并以信号量限流；SearchTreeBuilder 沿 parentUri 上溯层级并聚合计数。下方两条说明解释为什么不用 FTS5，以及进度条为什么是不确定的。</desc>

  <defs>
    <style>
      .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .mono { font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="470" rx="26" fill="#131217"/>

  <text class="sans" x="56" y="48" font-size="22" font-weight="600" fill="#8C8697">从选目录到结果树</text>
  <text class="mono" x="1144" y="48" font-size="18" text-anchor="end" fill="#5B5566">core/src/commonMain</text>

  <!-- ================= 阶段卡 ================= -->
  <g id="stages" class="sans">
    <g stroke="#6E6188" stroke-width="1.75" fill="none">
      <path d="M304 194 H 330 M322 187 L 330 194 L 322 201"/>
      <path d="M585 194 H 611 M603 187 L 611 194 L 603 201"/>
      <path d="M866 194 H 892 M884 187 L 892 194 L 884 201"/>
    </g>

    <!-- 1 预热 -->
    <g transform="translate(56 104)">
      <rect width="244" height="182" rx="12" fill="#1C1B1F" stroke="#302D36" stroke-width="1.25"/>
      <rect x="0" y="0" width="244" height="4" rx="2" fill="#3A3447"/>
      <text x="20" y="42" font-size="22" font-weight="600" fill="#E6E1E5">预热目录</text>
      <text class="mono" x="20" y="70" font-size="17" fill="#D0BCFF">IndexWarmer.warm</text>
      <text x="20" y="104" font-size="18" fill="#A9A3B4">按 lastModified</text>
      <text x="20" y="130" font-size="18" fill="#A9A3B4">增量补差，不重扫</text>
      <text x="20" y="156" font-size="18" fill="#A9A3B4">全盘；删掉的剔出库</text>
    </g>

    <!-- 2 索引库 -->
    <g transform="translate(337 104)">
      <rect width="244" height="182" rx="12" fill="#1C1B1F" stroke="#302D36" stroke-width="1.25"/>
      <rect x="0" y="0" width="244" height="4" rx="2" fill="#3A3447"/>
      <text x="20" y="42" font-size="22" font-weight="600" fill="#E6E1E5">索引库</text>
      <text class="mono" x="20" y="70" font-size="16" fill="#D0BCFF">root / entry / content</text>
      <text x="20" y="104" font-size="18" fill="#A9A3B4">SQLDelight 2.4.0</text>
      <text x="20" y="130" font-size="18" fill="#A9A3B4">主键 (tree_uri, uri)：</text>
      <text x="20" y="156" font-size="18" fill="#A9A3B4">一份库存多个目录</text>
    </g>

    <!-- 3 检索 -->
    <g transform="translate(618 104)">
      <rect width="244" height="182" rx="12" fill="#1C1B1F" stroke="#302D36" stroke-width="1.25"/>
      <rect x="0" y="0" width="244" height="4" rx="2" fill="#3A3447"/>
      <text x="20" y="42" font-size="22" font-weight="600" fill="#E6E1E5">检索</text>
      <text class="mono" x="20" y="70" font-size="17" fill="#D0BCFF">SearchEngine.search</text>
      <text x="20" y="104" font-size="18" fill="#A9A3B4">子目录各起协程，</text>
      <text x="20" y="130" font-size="18" fill="#A9A3B4">IO 用信号量限流 4</text>
      <text x="20" y="156" font-size="18" fill="#A9A3B4">正则只编译一次</text>
    </g>

    <!-- 4 建树 -->
    <g transform="translate(899 104)">
      <rect width="244" height="182" rx="12" fill="#1C1B1F" stroke="#302D36" stroke-width="1.25"/>
      <rect x="0" y="0" width="244" height="4" rx="2" fill="#E9C46A" opacity="0.5"/>
      <text x="20" y="42" font-size="22" font-weight="600" fill="#E6E1E5">结果树</text>
      <text class="mono" x="20" y="70" font-size="17" fill="#D0BCFF">SearchTreeBuilder</text>
      <text x="20" y="104" font-size="18" fill="#A9A3B4">沿 parentUri 上溯层级</text>
      <text x="20" y="130" font-size="18" fill="#A9A3B4">目录行聚合子树计数</text>
      <text x="20" y="156" font-size="18" fill="#A9A3B4">位置未知的平铺不丢</text>
    </g>
  </g>

  <!-- ================= 底部两条设计说明 ================= -->
  <g id="notes" class="sans">
    <g transform="translate(56 322)">
      <rect width="524" height="112" rx="12" fill="#17161B" stroke="#2A2730" stroke-width="1.25"/>
      <rect x="20" y="24" width="4" height="20" rx="2" fill="#D0BCFF"/>
      <text x="36" y="40" font-size="20" font-weight="600" fill="#E6E1E5">为什么不用 FTS5</text>
      <text x="36" y="70" font-size="18" fill="#A9A3B4">正则、全词、大小写敏感这些语义，分词索引服务不了。</text>
      <text x="36" y="96" font-size="18" fill="#A9A3B4">收益在「正文进了库」：二次检索不重读文件、不再解码。</text>
    </g>

    <g transform="translate(620 322)">
      <rect width="524" height="112" rx="12" fill="#17161B" stroke="#2A2730" stroke-width="1.25"/>
      <rect x="20" y="24" width="4" height="20" rx="2" fill="#E9C46A"/>
      <text x="36" y="40" font-size="20" font-weight="600" fill="#E6E1E5">进度条为什么是不确定的</text>
      <text x="36" y="70" font-size="18" fill="#A9A3B4">core 只报「扫过了多少」，没有总数，所以不给百分比。</text>
      <text x="36" y="96" font-size="18" fill="#A9A3B4">写死的 50% → 100% 假进度，这里没有照搬。</text>
    </g>
  </g>
</svg>
